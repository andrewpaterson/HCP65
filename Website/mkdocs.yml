extra:
  # Where the site's pages come from (DocsPlan.txt decision 13): each folder (relative to the folder holding the
  # repositories) lands at its site folder ("" is the top).  A project's Docs folder is laid out as the site's paths,
  # and its pages are items of the project (decision 10).  Read by tools/site_sources.py (the build and the checks),
  # TestAsm65C64Website and the IDE.
  sources:
    # The site's own pages: the home page, the overviews, the stylesheet.
    - folder: HCP65/Website/docs
      site: ""
      branch: main
    # CommonLibraries: the compiler, the 65C64 simulators, and the libraries' design.
    - folder: CommonLibraries/Libraries/CppCompilerLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/MicroprocessorLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/WindowLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/BaseLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/StandardLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/SupportLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/ProceduralLib/Docs
      site: ""
      branch: master
    - folder: CommonLibraries/Libraries/GerberLib/Docs
      site: ""
      branch: master
    # HCP65: the 65C64 proposal, the assembler and C library, the computer's kernal, programs and emulator.
    - folder: HCP65/X65C64-Proposal/Docs
      site: ""
      branch: main
    - folder: HCP65/Libraries/Assembler65Lib/Docs
      site: ""
      branch: main
    - folder: HCP65/Libraries/Libc65/Docs
      site: ""
      branch: main
    - folder: HCP65/Kernal/Docs
      site: ""
      branch: main
    - folder: HCP65/Boot/Docs
      site: ""
      branch: main
    - folder: HCP65/Shell/Docs
      site: ""
      branch: main
    - folder: HCP65/HCP65-Emulator/HCP65Lib/Docs
      site: ""
      branch: main
    - folder: HCP65/HCP65-Emulator/HCP65Emulator/Docs
      site: ""
      branch: main
    - folder: HCP65/HCP65-Tester/HCP65Tester/Docs
      site: ""
      branch: main
    # HCP65-IDE: the IDE, and hcp65build.
    - folder: HCP65-IDE/HCP65IDE/HCP65IDE/Docs
      site: ""
      branch: main
    - folder: HCP65-IDE/HCP65Build/Docs
      site: ""
      branch: main
    # LogiCim and HCP65-Sculpt.
    - folder: LogiCim/Libraries/LogicimLib/Docs
      site: ""
      branch: main
    - folder: HCP65-Sculpt/Libraries/SculptLib/Docs
      site: ""
      branch: main
  # References to code (DocsPlan.txt D): [`CTextArea::ReplaceRanges`] and [`BaseLib/Chars.h`] link to their line on
  # GitHub (tools/code_references.py).  The repositories they can be in, by folder, with where each is on GitHub;
  # each one's branch is its extra.sources entries'.
  repositories:
    CommonLibraries: https://github.com/andrewpaterson/Codaphela.Library
    HCP65: https://github.com/andrewpaterson/HCP65
    HCP65-IDE: https://github.com/andrewpaterson/HCP65-IDE
    LogiCim: https://github.com/andrewpaterson/Codaphela.LogiCim
    HCP65-Sculpt: https://github.com/andrewpaterson/HCP65-Sculpt
  # The solutions hcp65index indexes together for them (tools/symbol_table.py): a reference names what these
  # declare.  Their symbol table is kept in .symbols until a repository's HEAD changes.
  solutions:
    - HCP65-IDE/HCP65IDE/HCP65IDE.sln
    - HCP65/HCP65-Emulator/HCP65Emulator.sln
    - HCP65/Kernal/HCP65Kernal.sln
    - LogiCim/LogiCim/LogiCim.sln
    - HCP65-Sculpt/HCP65Sculpt/HCP65Sculpt.sln
