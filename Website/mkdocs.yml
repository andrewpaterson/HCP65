site_name: Codaphela
site_description: The HCP65 modern home computer, its C++ compiler, the 65C64 microprocessor proposal, the C++ software libraries and the HCP65 drivers and runtime
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - privacy
  - glightbox
  - table-reader

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - HCP65 Modern Home Computer:
      - hcp65/index.md
      - Memory Map: hcp65/memory-map.md
      - On-board Registers: hcp65/registers.md
      - Devices and Main Memory: hcp65/devices.md
      - Drivers and Runtime:
          - hcp65/runtime/index.md
          - W65C816 Runtime: hcp65/runtime/w65c816.md
      - Emulator: hcp65/emulator.md
  - HCP65 C++ Compiler:
      - compiler/index.md
  - 65C64 Microprocessor Proposal:
      - 65c64/index.md
      - Registers: 65c64/registers.md
      - Notation: 65c64/notation.md
      - Operands and Addressing: 65c64/operands.md
      - Opcode Encoding: 65c64/opcode-encoding.md
      - Instructions:
          - 65c64/instructions/index.md
          - Copy: 65c64/instructions/cpy.md
          - Copy Extend: 65c64/instructions/cpyx.md
          - Logical: 65c64/instructions/logical.md
          - Arithmetic: 65c64/instructions/arithmetic.md
          - Shift: 65c64/instructions/shift.md
          - Subcopy: 65c64/instructions/subcopy.md
          - Find: 65c64/instructions/find.md
          - Multiply and Divide: 65c64/instructions/multiply-divide.md
          - Jump: 65c64/instructions/jump.md
          - Branch: 65c64/instructions/branch.md
          - Return: 65c64/instructions/return.md
          - Stack: 65c64/instructions/stack.md
          - Status: 65c64/instructions/status.md
          - Register Width: 65c64/instructions/width.md
          - Control: 65c64/instructions/control.md
          - Block: 65c64/instructions/block.md
          - Vector: 65c64/instructions/vector.md
          - Hardware Registers: 65c64/instructions/hardware.md
      - Emulator: 65c64/emulator.md
  - C++ Software Libraries:
      - libraries/index.md
