# The website's tables of 65C64 instructions, made from the Instructions sheet of "65C64 Instruction Architecture.xlsx"
# by HCP65/Website/tools/instruction_tables.py (HCP65/Website/DocsPlan.txt C1).  Each table is written to
# Generated/<table>.txt, which its page includes (--8<-- "<table>.txt").  A table has its columns (what each shows,
# and its heading) and its rows, each the sheet's number for an instruction (column B), with where its mnemonic links
# to in a "link" column.
#
# Columns: link (the mnemonic, linked), mnemonic (the mnemonic, left out where it is the row above's in a table with a
# form column), name (the sheet's name without "(zero extend)", "(sign extend)", "(unsigned)" or "(signed)"), form
# (that word, or nothing), operation, flags, w65c816.  A row written {row: n, text: true} shows its mnemonic as
# `#!text abs`: a name C++ has too.
#
# A table with a sheet is that sheet's rows, from its second: fields names its columns from A, and columns says which
# of them the table shows.

index-copy:
  columns: [[link, Mnemonic], [name, Name], [operation, Operation], [flags, Flags], [w65c816, W65C816]]
  rows: [[0, cpy.md], [2, logical.md], [4, logical.md], [6, logical.md], [8, logical.md], [10, arithmetic.md],
         [12, arithmetic.md], [14, arithmetic.md], [44, cpyx.md], [67, shift.md], [68, shift.md]]

